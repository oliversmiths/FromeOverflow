name: Poll storm overflows

on:
  schedule:
    # Off the hour boundary on purpose — GitHub drops/delays scheduled runs
    # most around :00. This is only a fallback; an external cron hits the
    # workflow_dispatch API every 15 min for the real cadence (see SETUP.md).
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:          # external trigger + "run by hand" from the Actions tab

permissions:
  contents: write

concurrency:
  group: poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # No install step — poll.js has no dependencies.
      - name: Fetch a reading
        run: node poll.js

      - name: Commit the new reading
        run: |
          git config user.name  "overflow-bot"
          git config user.email "actions@github.com"
          git add overflows.db docs/data.json
          git diff --staged --quiet && { echo "Nothing changed."; exit 0; }
          git commit -m "Reading at $(date -u +'%Y-%m-%d %H:%M')"

          # A manual push can land between checkout and push. The reading only
          # touches overflows.db + docs/data.json, which hand commits never do,
          # so a rebase onto origin is always clean — just retry the race.
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push; then
              exit 0
            fi
            echo "push attempt $attempt lost the race, retrying…"
            sleep $((RANDOM % 8 + 3))
          done
          echo "Could not push after 5 attempts."
          exit 1

      # --- Deploy to SiteGround --------------------------------------------
      # Skipped until you add the SG_SSH_KEY secret, so polling works on its
      # own from day one and you can wire up hosting whenever you're ready.

      - name: Deploy docs/ to SiteGround
        if: ${{ vars.DEPLOY_TO_SITEGROUND == 'true' }}
        env:
          SG_HOST: ${{ secrets.SG_HOST }}
          SG_USER: ${{ secrets.SG_USER }}
          SG_PATH: ${{ secrets.SG_PATH }}
          SG_PORT: ${{ secrets.SG_PORT }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SG_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${SG_PORT:-18765}" "$SG_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -p ${SG_PORT:-18765} -o StrictHostKeyChecking=yes" \
            docs/ "$SG_USER@$SG_HOST:$SG_PATH/"
